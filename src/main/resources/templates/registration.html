<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>User Registration</title>
  <style>
    .container { max-width: 600px; margin: 40px auto; padding: 20px; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 6px; }
    .error { color: red; font-size: 0.9em; }
  </style>
</head>
<body>
<div class="container">
  <h1>User Registration</h1>

  <form th:action="@{/register}" th:object="${user}" method="post">
    <div class="field">
      <label for="nickname">Nickname</label>
      <input type="text" id="nickname" th:field="*{nickname}" required />
      <div class="error" th:if="${#fields.hasErrors('nickname')}"
           th:errors="*{nickname}"></div>
    </div>

    <div class="field">
      <label for="firstName">First name</label>
      <input type="text" id="firstName" th:field="*{firstName}" required />
      <div class="error" th:if="${#fields.hasErrors('firstName')}"
           th:errors="*{firstName}"></div>
    </div>

    <div class="field">
      <label for="lastName">Last name</label>
      <input type="text" id="lastName" th:field="*{lastName}" required />
      <div class="error" th:if="${#fields.hasErrors('lastName')}"
           th:errors="*{lastName}"></div>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" th:field="*{email}" required />
      <div class="error" th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}"></div>
    </div>

    <div class="field">
      <label for="phone">Phone</label>
      <input type="text" id="phone" th:field="*{phone}" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" th:field="*{password}" required />
      <div class="error" th:if="${#fields.hasErrors('password')}"
           th:errors="*{password}"></div>
    </div>

    <!-- Optional: let user select type and status, or set defaults in controller -->
    <div class="field">
      <label for="userType">User type</label>
      <select id="userType" th:field="*{userType}">
        <option th:each="type : ${userTypes}"
                th:value="${type}"
                th:text="${type}"></option>
      </select>
    </div>

    <div class="field">
      <label for="status">Status</label>
      <select id="status" th:field="*{status}">
        <option th:each="s : ${statuses}"
                th:value="${s}"
                th:text="${s}"></option>
      </select>
    </div>

    <button type="submit">Register</button>
  </form>

  <p style="margin-top: 16px;">
    <a th:href="@{/}">Back to Home</a>
  </p>
</div>
</body>
</html>
